[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dpm"
version = "1.0.0"
description = "Frequent pattern extraction (Apriori, FP-Growth) for multiple disease detection"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy>=1.24", "pandas>=2.0", "scikit-learn>=1.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
